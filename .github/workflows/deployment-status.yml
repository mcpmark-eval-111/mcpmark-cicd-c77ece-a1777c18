name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create-issue.outputs.issue_number }}
      previous_sha: ${{ steps.capture.outputs.previous_sha }}
      package_version: ${{ steps.capture.outputs.package_version }}
      short_sha: ${{ steps.capture.outputs.short_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        id: lint
        continue-on-error: true
        run: |
          set +e
          npm run lint
          echo "lint_status=$?" >> "$GITHUB_OUTPUT"

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          npm test --silent
          echo "test_status=$?" >> "$GITHUB_OUTPUT"

      - name: Capture deployment metadata
        id: capture
        run: |
          set -euo pipefail
          PREV_SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "${{ github.sha }}")
          PKG_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "previous_sha=${PREV_SHA}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Previous Commit: ${PREV_SHA}"
          echo "Current Commit: ${GITHUB_SHA}"
          echo "Package Version: ${PKG_VERSION}"

      - name: Create deployment tracking issue
        id: create-issue
        uses: actions/github-script@v7
        env:
          PREV_SHA: ${{ steps.capture.outputs.previous_sha }}
          PKG_VERSION: ${{ steps.capture.outputs.package_version }}
        with:
          script: |
            const sha = context.sha;
            const previousSha = process.env.PREV_SHA;
            const packageVersion = process.env.PKG_VERSION;

            const body = [
              '## Deployment Tracking',
              '',
              `- **Commit SHA:** \`${sha}\``,
              `- **Previous Commit:** \`${previousSha}\``,
              `- **Package Version:** ${packageVersion}`,
              `- **Triggered by:** @${context.actor}`,
              `- **Workflow Run:** [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              '### Status',
              '',
              '- [x] Pre-deployment checks',
              '- [ ] Rollback artifacts prepared',
              '- [ ] Deployment finalized',
              '',
              'This issue tracks the deployment of the latest push to `main`.'
            ].join('
');

            const result = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${sha}`,
              body: body,
              labels: ['deployment', 'in-progress']
            });

            core.setOutput('issue_number', result.data.number);
            core.info(`Created deployment tracking issue #${result.data.number}`);

      - name: Post pre-deployment comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.create-issue.outputs.issue_number }}
          PREV_SHA: ${{ steps.capture.outputs.previous_sha }}
          PKG_VERSION: ${{ steps.capture.outputs.package_version }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const prevSha = process.env.PREV_SHA;
            const pkgVersion = process.env.PKG_VERSION;

            const body = [
              '## ✅ Pre-deployment checks completed',
              '',
              'All quality gates passed for this deployment.',
              '',
              '### Quality Checks',
              '',
              '- ✅ Lint: passed',
              '- ✅ Tests: passed',
              '- ✅ Build: ready',
              '',
              '### Captured Metadata',
              '',
              `- Previous Commit: \`${prevSha}\``,
              `- Current Commit: \`${context.sha}\``,
              `- Package Version: ${pkgVersion}`,
              '',
              'Proceeding to rollback preparation stage.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    outputs:
      issue_number: ${{ needs.pre-deployment.outputs.issue_number }}
      previous_sha: ${{ needs.pre-deployment.outputs.previous_sha }}
      package_version: ${{ needs.pre-deployment.outputs.package_version }}
      short_sha: ${{ needs.pre-deployment.outputs.short_sha }}
      package_checksum: ${{ steps.build-rollback.outputs.package_checksum }}
      artifact_name: ${{ steps.build-rollback.outputs.artifact_name }}
      script_created: ${{ steps.build-rollback.outputs.script_created }}
      backup_created: ${{ steps.build-rollback.outputs.backup_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build comprehensive rollback artifacts
        id: build-rollback
        env:
          PREV_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          PKG_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          SHORT_SHA: ${{ needs.pre-deployment.outputs.short_sha }}
        run: |
          set -euo pipefail

          ARTIFACT_NAME="rollback-package-${SHORT_SHA}"
          STAGING_DIR="rollback-artifacts"
          BACKUPS_DIR="${STAGING_DIR}/backups"
          mkdir -p "${BACKUPS_DIR}"

          CURRENT_SHA="${GITHUB_SHA}"
          GENERATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 1) Executable rollback script with proper error handling
          cat > "${STAGING_DIR}/rollback.sh" <<'ROLLBACK_EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          # ------------------------------------------------------------
          # Rollback Script
          # Generated by Deployment Status workflow
          # ------------------------------------------------------------

          PREVIOUS_SHA="__PREV_SHA__"
          CURRENT_SHA="__CURRENT_SHA__"
          PACKAGE_VERSION="__PKG_VERSION__"
          GENERATED_AT="__GENERATED_AT__"

          log()  { printf '[rollback] %s
' "$*"; }
          warn() { printf '[rollback][warn] %s
' "$*" >&2; }
          fail() { printf '[rollback][error] %s
' "$*" >&2; exit 1; }

          trap 'fail "Rollback failed at line ${LINENO}"' ERR

          log "Starting rollback procedure"
          log "  Generated at:  ${GENERATED_AT}"
          log "  Current SHA:   ${CURRENT_SHA}"
          log "  Previous SHA:  ${PREVIOUS_SHA}"
          log "  Pkg Version:   ${PACKAGE_VERSION}"

          # Required tooling checks
          for tool in git node npm; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              fail "Required tool '${tool}' is not available"
            fi
          done

          if ! git rev-parse --git-dir >/dev/null 2>&1; then
            fail "Current directory is not a git repository"
          fi

          ROLLBACK_BRANCH="rollback/${CURRENT_SHA:0:7}-$(date -u +%Y%m%d%H%M%S)"
          log "Creating rollback branch: ${ROLLBACK_BRANCH}"
          git fetch --all --tags --quiet || warn "git fetch failed"
          git checkout -b "${ROLLBACK_BRANCH}" "${PREVIOUS_SHA}" \
            || fail "Unable to checkout previous commit ${PREVIOUS_SHA}"

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          if [ -d "${SCRIPT_DIR}/backups" ]; then
            log "Restoring configuration backups"
            cp "${SCRIPT_DIR}/backups/package.json" ./package.json 2>/dev/null \
              || warn "package.json backup not restored"
            cp "${SCRIPT_DIR}/backups/package-lock.json" ./package-lock.json 2>/dev/null \
              || warn "package-lock.json backup not restored"
          fi

          log "Reinstalling dependencies"
          if [ -f package-lock.json ]; then
            npm ci || fail "npm ci failed during rollback"
          else
            npm install || fail "npm install failed during rollback"
          fi

          if [ -x "${SCRIPT_DIR}/verify-dependencies.sh" ]; then
            log "Running dependency verification"
            "${SCRIPT_DIR}/verify-dependencies.sh" \
              || fail "Dependency verification reported errors"
          fi

          log "Running test suite to validate rollback"
          npm test --silent || warn "Tests reported failures - manual review required"

          log "Rollback completed successfully"
          log "  Branch:        ${ROLLBACK_BRANCH}"
          log "  Restored to:   ${PREVIOUS_SHA}"
          log "Push branch with: git push origin ${ROLLBACK_BRANCH}"
          ROLLBACK_EOF

          # Inject deployment metadata into the rollback script
          sed -i \
            -e "s|__PREV_SHA__|${PREV_SHA}|g" \
            -e "s|__CURRENT_SHA__|${CURRENT_SHA}|g" \
            -e "s|__PKG_VERSION__|${PKG_VERSION}|g" \
            -e "s|__GENERATED_AT__|${GENERATED_AT}|g" \
            "${STAGING_DIR}/rollback.sh"

          chmod +x "${STAGING_DIR}/rollback.sh"

          # Validate the generated script
          SCRIPT_CREATED=false
          if [ -x "${STAGING_DIR}/rollback.sh" ] && bash -n "${STAGING_DIR}/rollback.sh"; then
            SCRIPT_CREATED=true
          fi

          # 2) Configuration backups
          cp package.json "${BACKUPS_DIR}/package.json"
          if [ -f package-lock.json ]; then
            cp package-lock.json "${BACKUPS_DIR}/package-lock.json"
          fi

          cat > "${BACKUPS_DIR}/.env.template" <<'ENV_EOF'
          # Environment template captured for rollback
          NODE_ENV=production
          PORT=3000
          LOG_LEVEL=info
          # Add additional environment variables required by the application
          ENV_EOF

          cat > "${BACKUPS_DIR}/.env.production.template" <<'ENV_PROD_EOF'
          # Production environment template (rollback)
          NODE_ENV=production
          PORT=3000
          LOG_LEVEL=warn
          # Production-only variables go here
          ENV_PROD_EOF

          BACKUP_CREATED=false
          if [ -f "${BACKUPS_DIR}/package.json" ] \
             && [ -f "${BACKUPS_DIR}/.env.template" ]; then
            BACKUP_CREATED=true
          fi

          # 3) Dependency verification script
          cat > "${STAGING_DIR}/verify-dependencies.sh" <<'VERIFY_EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          log()  { printf '[verify] %s
' "$*"; }
          warn() { printf '[verify][warn] %s
' "$*" >&2; }
          fail() { printf '[verify][error] %s
' "$*" >&2; exit 1; }

          trap 'fail "Verification aborted at line ${LINENO}"' ERR

          log "Starting dependency verification"

          for tool in node npm; do
            command -v "${tool}" >/dev/null 2>&1 \
              || fail "Required tool '${tool}' missing"
          done

          NODE_VERSION=$(node --version)
          NPM_VERSION=$(npm --version)
          log "Node.js version: ${NODE_VERSION}"
          log "npm version:     ${NPM_VERSION}"

          if [ -f package.json ]; then
            REQUIRED_NODE=$(node -p "(require('./package.json').engines && require('./package.json').engines.node) || 'any'")
            log "Required Node:   ${REQUIRED_NODE}"
            node -e "JSON.parse(require('fs').readFileSync('./package.json','utf8'))" \
              || fail "package.json is not valid JSON"
          else
            fail "package.json not found"
          fi

          if [ -f package-lock.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('./package-lock.json','utf8'))" \
              || fail "package-lock.json is not valid JSON"
            log "package-lock.json: valid"
          else
            warn "package-lock.json missing - install may produce different versions"
          fi

          if [ -d node_modules ]; then
            log "node_modules: present"
            npm ls --depth=0 --silent \
              || warn "npm ls reported issues; review for compatibility"
          else
            warn "node_modules missing - run 'npm ci' before serving traffic"
          fi

          log "Dependency verification complete"
          VERIFY_EOF
          chmod +x "${STAGING_DIR}/verify-dependencies.sh"

          # 4) Detailed rollback documentation
          cat > "${STAGING_DIR}/ROLLBACK.md" <<DOC_EOF
          # Rollback Procedure

          Detailed step-by-step rollback for deployment commit \`${CURRENT_SHA}\`.

          ## Deployment Snapshot

          | Field            | Value |
          | ---------------- | ----- |
          | Current Commit   | \`${CURRENT_SHA}\` |
          | Previous Commit  | \`${PREV_SHA}\` |
          | Package Version  | ${PKG_VERSION} |
          | Generated At     | ${GENERATED_AT} |
          | Artifact Name    | ${ARTIFACT_NAME} |

          ## Step-by-Step Rollback

          1. **Download the rollback artifact** from the workflow run:
             - Open the GitHub Actions run that produced this artifact.
             - Download \`${ARTIFACT_NAME}\`.

          2. **Verify integrity** with the bundled checksums:
             \`\`\`bash
             sha256sum -c SHA256SUMS
             \`\`\`

          3. **Extract the artifact and enter the directory**:
             \`\`\`bash
             unzip ${ARTIFACT_NAME}.zip
             cd rollback-artifacts
             \`\`\`

          4. **Inspect the rollback script** before execution:
             \`\`\`bash
             cat rollback.sh
             test -x rollback.sh && echo "rollback.sh is executable"
             \`\`\`

          5. **Execute the rollback** from a checkout of the repository:
             \`\`\`bash
             cd <path-to-repo-checkout>
             /path/to/rollback-artifacts/rollback.sh
             \`\`\`

          6. **Verify dependencies** after rollback:
             \`\`\`bash
             /path/to/rollback-artifacts/verify-dependencies.sh
             \`\`\`

          7. **Smoke test the application**:
             \`\`\`bash
             npm test
             npm start
             \`\`\`

          8. **Push the rollback branch** if validation succeeds:
             \`\`\`bash
             git push origin <rollback-branch>
             \`\`\`

          ## Quick Rollback Command

          \`\`\`bash
          git checkout ${PREV_SHA}
          npm ci
          npm test
          npm start
          \`\`\`

          ## Bundled Files

          - \`rollback.sh\` — Executable rollback script with strict error handling
          - \`verify-dependencies.sh\` — Dependency compatibility checker
          - \`backups/package.json\` — Captured package.json
          - \`backups/package-lock.json\` — Captured package-lock.json (if present)
          - \`backups/.env.template\` — Environment template
          - \`backups/.env.production.template\` — Production environment template
          - \`SHA256SUMS\` — Integrity checksums for rollback contents
          - \`metadata.json\` — Machine-readable rollback metadata
          DOC_EOF

          # 5) Machine readable metadata
          cat > "${STAGING_DIR}/metadata.json" <<META_EOF
          {
            "current_commit": "${CURRENT_SHA}",
            "previous_commit": "${PREV_SHA}",
            "package_version": "${PKG_VERSION}",
            "artifact_name": "${ARTIFACT_NAME}",
            "generated_at": "${GENERATED_AT}",
            "components": {
              "rollback_script": true,
              "configuration_backup": ${BACKUP_CREATED},
              "dependency_verification": true,
              "documentation": true,
              "compressed_package": true,
              "checksums": true
            }
          }
          META_EOF

          # 6) Compute SHA256 checksums for everything (excluding the eventual tarball)
          (
            cd "${STAGING_DIR}"
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

          # 7) Build compressed rollback package and compute its checksum
          PACKAGE_FILE="${ARTIFACT_NAME}.tar.gz"
          tar -czf "${PACKAGE_FILE}" "${STAGING_DIR}"
          PACKAGE_CHECKSUM=$(sha256sum "${PACKAGE_FILE}" | awk '{print $1}')
          echo "${PACKAGE_CHECKSUM}  ${PACKAGE_FILE}" > "${STAGING_DIR}/PACKAGE_SHA256SUM"
          mv "${PACKAGE_FILE}" "${STAGING_DIR}/"

          ls -la "${STAGING_DIR}"
          echo "Rollback package checksum: ${PACKAGE_CHECKSUM}"

          {
            echo "package_checksum=${PACKAGE_CHECKSUM}"
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "script_created=${SCRIPT_CREATED}"
            echo "backup_created=${BACKUP_CREATED}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload rollback artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-rollback.outputs.artifact_name }}
          path: rollback-artifacts/
          retention-days: 30
          if-no-files-found: error

      - name: Verify uploaded artifact (download check)
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.build-rollback.outputs.artifact_name }}
          path: downloaded-artifact

      - name: Validate downloaded artifact checksums
        run: |
          set -euo pipefail
          ls -la downloaded-artifact
          if [ -f downloaded-artifact/SHA256SUMS ]; then
            (cd downloaded-artifact && sha256sum -c SHA256SUMS)
          else
            echo "SHA256SUMS file missing in downloaded artifact" >&2
            exit 1
          fi

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.pre-deployment.outputs.issue_number }}
          PREV_SHA: ${{ needs.pre-deployment.outputs.previous_sha }}
          PKG_VERSION: ${{ needs.pre-deployment.outputs.package_version }}
          SHORT_SHA: ${{ needs.pre-deployment.outputs.short_sha }}
          ARTIFACT_NAME: ${{ steps.build-rollback.outputs.artifact_name }}
          PACKAGE_CHECKSUM: ${{ steps.build-rollback.outputs.package_checksum }}
          SCRIPT_CREATED: ${{ steps.build-rollback.outputs.script_created }}
          BACKUP_CREATED: ${{ steps.build-rollback.outputs.backup_created }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const prevSha = process.env.PREV_SHA;
            const pkgVersion = process.env.PKG_VERSION;
            const artifactName = process.env.ARTIFACT_NAME;
            const packageChecksum = process.env.PACKAGE_CHECKSUM;
            const scriptCreated = process.env.SCRIPT_CREATED;
            const backupCreated = process.env.BACKUP_CREATED;
            const currentSha = context.sha;

            const body = [
              '## 🔄 Rollback Plan Ready',
              '',
              'Comprehensive rollback artifacts have been prepared, uploaded, and verified.',
              '',
              '### Deployment Information',
              '',
              `- Previous Commit: ${prevSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${pkgVersion}`,
              `- Artifact: ${artifactName}`,
              '',
              '### Rollback Components',
              '',
              '- ✅ Executable rollback script with strict error handling',
              '- ✅ Configuration backups (package.json, package-lock.json, environment templates)',
              '- ✅ Dependency verification script for compatibility checking',
              '- ✅ Detailed rollback documentation with step-by-step instructions',
              '- ✅ Compressed rollback package with SHA256 checksums',
              '- ✅ Artifact uploaded to GitHub Actions (30-day retention)',
              '- ✅ Downloaded artifact validated against checksum manifest',
              '',
              '### Verification',
              '',
              `- Rollback script created: ${scriptCreated}`,
              `- Configuration backup: ${backupCreated}`,
              `- SHA256: ${packageChecksum}`,
              '',
              '### Quick Rollback Command',
              '',
              '```bash',
              `git checkout ${prevSha}`,
              'npm ci',
              'npm test',
              'npm start',
              '```',
              '',
              'Download the artifact from this workflow run to perform a manual rollback if required.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs: rollback-preparation
    steps:
      - name: Update labels and finalize deployment
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ needs.rollback-preparation.outputs.issue_number }}
          ARTIFACT_NAME: ${{ needs.rollback-preparation.outputs.artifact_name }}
          PREV_SHA: ${{ needs.rollback-preparation.outputs.previous_sha }}
          PKG_VERSION: ${{ needs.rollback-preparation.outputs.package_version }}
          PACKAGE_CHECKSUM: ${{ needs.rollback-preparation.outputs.package_checksum }}
        with:
          script: |
            const issueNumber = parseInt(process.env.ISSUE_NUMBER, 10);
            const artifactName = process.env.ARTIFACT_NAME;
            const prevSha = process.env.PREV_SHA;
            const pkgVersion = process.env.PKG_VERSION;
            const packageChecksum = process.env.PACKAGE_CHECKSUM;
            const currentSha = context.sha;

            // Remove the in-progress label (best effort)
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
              core.info('Removed label: in-progress');
            } catch (error) {
              core.warning(`Could not remove in-progress label: ${error.message}`);
            }

            // Ensure the completed label exists, creating it if necessary
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'completed'
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'completed',
                  color: '0e8a16',
                  description: 'Deployment completed successfully'
                });
                core.info('Created label: completed');
              } else {
                throw error;
              }
            }

            // Add the completed label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });
            core.info('Added label: completed');

            // Final comment with deployment + rollback artifact details
            const body = [
              '## ✅ Deployment Completed Successfully',
              '',
              'The deployment for this commit has finished and the rollback safety net is in place.',
              '',
              '### Deployment Summary',
              '',
              `- Current Commit: ${currentSha}`,
              `- Previous Commit: ${prevSha}`,
              `- Package Version: ${pkgVersion}`,
              `- Triggered by: @${context.actor}`,
              '',
              '### Rollback Artifact Details',
              '',
              `- Artifact: ${artifactName}`,
              '- Retention: 30 days',
              `- SHA256: ${packageChecksum}`,
              '- Contents: rollback script, configuration backups, dependency verification, documentation, SHA256 checksums',
              '',
              'Closing this deployment tracking issue.'
            ].join('
');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            // Close the issue
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
            core.info(`Closed deployment tracking issue #${issueNumber}`);
