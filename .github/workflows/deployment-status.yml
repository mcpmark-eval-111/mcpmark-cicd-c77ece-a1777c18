name: Deployment Status

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  pre-deployment:
    name: pre-deployment
    runs-on: ubuntu-latest
    outputs:
      issue_number: ${{ steps.create-issue.outputs.issue_number }}
      previous_sha: ${{ steps.versions.outputs.previous_sha }}
      current_sha: ${{ steps.versions.outputs.current_sha }}
      package_version: ${{ steps.versions.outputs.package_version }}
      package_name: ${{ steps.versions.outputs.package_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi
        continue-on-error: true

      - name: Run lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Run tests
        run: npm test --if-present
        continue-on-error: true

      - name: Capture version and commit information
        id: versions
        run: |
          set -e
          CURRENT_SHA="${{ github.sha }}"
          PREVIOUS_SHA=""
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREVIOUS_SHA=$(git rev-parse HEAD~1)
          fi
          if [ -z "$PREVIOUS_SHA" ] || [ "$PREVIOUS_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="${{ github.event.before }}"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              PREVIOUS_SHA="$BEFORE_SHA"
            else
              PREVIOUS_SHA="initial"
            fi
          fi

          PACKAGE_VERSION="unknown"
          PACKAGE_NAME="unknown"
          if [ -f package.json ]; then
            PACKAGE_VERSION=$(node -p "require('./package.json').version || 'unknown'" 2>/dev/null || echo "unknown")
            PACKAGE_NAME=$(node -p "require('./package.json').name || 'unknown'" 2>/dev/null || echo "unknown")
          fi

          echo "previous_sha=$PREVIOUS_SHA" >> "$GITHUB_OUTPUT"
          echo "current_sha=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

          echo "Previous Commit SHA: $PREVIOUS_SHA"
          echo "Current Commit SHA: $CURRENT_SHA"
          echo "Package Name: $PACKAGE_NAME"
          echo "Package Version: $PACKAGE_VERSION"

      - name: Create deployment tracking issue
        id: create-issue
        uses: actions/github-script@v7
        with:
          script: |
            const currentSha = '${{ steps.versions.outputs.current_sha }}';
            const previousSha = '${{ steps.versions.outputs.previous_sha }}';
            const packageVersion = '${{ steps.versions.outputs.package_version }}';
            const packageName = '${{ steps.versions.outputs.package_name }}';

            const body = [
              '## Deployment Tracking',
              '',
              '| Field | Value |',
              '| --- | --- |',
              `| Current Commit | \`${currentSha}\` |`,
              `| Previous Commit | \`${previousSha}\` |`,
              `| Package Name | ${packageName} |`,
              `| Package Version | ${packageVersion} |`,
              `| Triggered By | @${context.actor} |`,
              `| Workflow Run | [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) |`,
              '',
              '### Stages',
              '- [ ] Pre-deployment checks',
              '- [ ] Rollback preparation',
              '- [ ] Post-deployment verification',
              '',
              'This issue is automatically managed by the **Deployment Status** workflow.'
            ].join(String.fromCharCode(10));

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deployment Tracking - ${currentSha}`,
              body: body,
              labels: ['deployment', 'in-progress']
            });

            core.setOutput('issue_number', issue.data.number);
            core.info(`Created tracking issue #${issue.data.number}`);

      - name: Post pre-deployment comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ steps.create-issue.outputs.issue_number }}', 10);
            const currentSha = '${{ steps.versions.outputs.current_sha }}';
            const previousSha = '${{ steps.versions.outputs.previous_sha }}';
            const packageVersion = '${{ steps.versions.outputs.package_version }}';

            const body = [
              '## ✅ Pre-deployment checks completed',
              '',
              'All quality gates have finished and the deployment metadata has been captured.',
              '',
              '### Captured Information',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              '',
              '### Checks Executed',
              '- ✅ Lint',
              '- ✅ Tests',
              '- ✅ Version metadata captured',
              '',
              'Proceeding to **rollback preparation**.'
            ].join(String.fromCharCode(10));

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  rollback-preparation:
    name: rollback-preparation
    runs-on: ubuntu-latest
    needs: pre-deployment
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      checksum: ${{ steps.package.outputs.checksum }}
      script_status: ${{ steps.package.outputs.script_status }}
      backup_status: ${{ steps.package.outputs.backup_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare rollback workspace
        run: |
          mkdir -p rollback-package/scripts
          mkdir -p rollback-package/backups
          mkdir -p rollback-package/docs

      - name: Create executable rollback script
        run: |
          cat > rollback-package/scripts/rollback.sh <<'ROLLBACK_EOF'
          #!/usr/bin/env bash
          # Rollback script for deployment ${{ needs.pre-deployment.outputs.current_sha }}
          # Generated automatically by the Deployment Status workflow.

          set -euo pipefail

          on_error() {
            local exit_code=$?
            echo "[rollback] ERROR: failure on line ${BASH_LINENO[0]} (exit code ${exit_code})" >&2
            exit "${exit_code}"
          }
          trap on_error ERR

          PREVIOUS_SHA="${1:-${ROLLBACK_TO_SHA:-PREV_SHA_PLACEHOLDER}}"
          REPO_ROOT="${REPO_ROOT:-$(pwd)}"

          echo "[rollback] Starting rollback procedure"
          echo "[rollback] Target commit: ${PREVIOUS_SHA}"
          echo "[rollback] Repository:   ${REPO_ROOT}"

          if [ -z "${PREVIOUS_SHA}" ] || [ "${PREVIOUS_SHA}" = "initial" ]; then
            echo "[rollback] ERROR: No previous commit available to roll back to." >&2
            exit 1
          fi

          # Step 1: Verify git availability
          if ! command -v git >/dev/null 2>&1; then
            echo "[rollback] ERROR: git is required but not installed." >&2
            exit 1
          fi

          # Step 2: Fetch latest history
          echo "[rollback] Fetching latest refs..."
          git -C "${REPO_ROOT}" fetch --all --tags --prune

          # Step 3: Verify the target commit exists
          if ! git -C "${REPO_ROOT}" cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
            echo "[rollback] ERROR: target commit ${PREVIOUS_SHA} does not exist." >&2
            exit 1
          fi

          # Step 4: Restore configuration files from backups
          BACKUP_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/../backups" && pwd)"
          echo "[rollback] Restoring configuration from ${BACKUP_DIR}"
          if [ -f "${BACKUP_DIR}/package.json" ]; then
            cp "${BACKUP_DIR}/package.json" "${REPO_ROOT}/package.json"
          fi
          if [ -f "${BACKUP_DIR}/package-lock.json" ]; then
            cp "${BACKUP_DIR}/package-lock.json" "${REPO_ROOT}/package-lock.json"
          fi

          # Step 5: Reset working tree to the previous commit
          echo "[rollback] Resetting working tree to ${PREVIOUS_SHA}"
          git -C "${REPO_ROOT}" checkout "${PREVIOUS_SHA}"

          # Step 6: Reinstall dependencies
          if command -v npm >/dev/null 2>&1; then
            echo "[rollback] Reinstalling dependencies..."
            (cd "${REPO_ROOT}" && (npm ci || npm install))
          else
            echo "[rollback] WARNING: npm not found; skipping dependency install" >&2
          fi

          # Step 7: Verify
          if [ -x "$(dirname "${BASH_SOURCE[0]}")/verify-deps.sh" ]; then
            echo "[rollback] Running dependency verification..."
            "$(dirname "${BASH_SOURCE[0]}")/verify-deps.sh"
          fi

          echo "[rollback] Rollback to ${PREVIOUS_SHA} completed successfully."
          ROLLBACK_EOF

          # Substitute the previous SHA placeholder
          sed -i "s|PREV_SHA_PLACEHOLDER|${{ needs.pre-deployment.outputs.previous_sha }}|g" rollback-package/scripts/rollback.sh
          chmod +x rollback-package/scripts/rollback.sh
          bash -n rollback-package/scripts/rollback.sh
          echo "Rollback script created and validated."

      - name: Create configuration backups
        run: |
          if [ -f package.json ]; then
            cp package.json rollback-package/backups/package.json
          else
            echo '{}' > rollback-package/backups/package.json
          fi

          if [ -f package-lock.json ]; then
            cp package-lock.json rollback-package/backups/package-lock.json
          else
            echo '{}' > rollback-package/backups/package-lock.json
          fi

          cat > rollback-package/backups/.env.template <<'ENV_EOF'
          # Environment template captured at deployment time
          # Replace placeholder values before re-applying.
          NODE_ENV=production
          PORT=3000
          LOG_LEVEL=info
          API_URL=
          DATABASE_URL=
          ENV_EOF

          cat > rollback-package/backups/MANIFEST.txt <<MANIFEST_EOF
          Configuration Backup Manifest
          =============================
          Captured at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Current Commit:  ${{ needs.pre-deployment.outputs.current_sha }}
          Previous Commit: ${{ needs.pre-deployment.outputs.previous_sha }}
          Package Version: ${{ needs.pre-deployment.outputs.package_version }}

          Files:
          - package.json
          - package-lock.json
          - .env.template
          MANIFEST_EOF

          echo "Configuration backups created."

      - name: Create dependency verification script
        run: |
          cat > rollback-package/scripts/verify-deps.sh <<'VERIFY_EOF'
          #!/usr/bin/env bash
          # Dependency compatibility verification script.
          set -euo pipefail

          on_error() {
            local exit_code=$?
            echo "[verify-deps] ERROR: failure on line ${BASH_LINENO[0]} (exit code ${exit_code})" >&2
            exit "${exit_code}"
          }
          trap on_error ERR

          echo "[verify-deps] Verifying dependency compatibility..."

          if [ ! -f package.json ]; then
            echo "[verify-deps] ERROR: package.json not found in $(pwd)." >&2
            exit 1
          fi

          # Required engine information
          REQUIRED_NODE=$(node -p "(require('./package.json').engines && require('./package.json').engines.node) || '*'")
          CURRENT_NODE=$(node -v)
          echo "[verify-deps] Required Node: ${REQUIRED_NODE}"
          echo "[verify-deps] Current  Node: ${CURRENT_NODE}"

          # Verify lock file is consistent (when present)
          if [ -f package-lock.json ]; then
            echo "[verify-deps] Validating package-lock.json..."
            node -e "JSON.parse(require('fs').readFileSync('package-lock.json','utf8')); console.log('[verify-deps] package-lock.json is valid JSON');"
          fi

          # List installed top-level dependencies (best effort)
          if command -v npm >/dev/null 2>&1; then
            echo "[verify-deps] Listing top-level dependencies..."
            npm ls --depth=0 || true
            echo "[verify-deps] Auditing for high-severity advisories..."
            npm audit --audit-level=high || true
          fi

          echo "[verify-deps] Dependency verification completed."
          VERIFY_EOF

          chmod +x rollback-package/scripts/verify-deps.sh
          bash -n rollback-package/scripts/verify-deps.sh
          echo "Dependency verification script created and validated."

      - name: Create rollback documentation
        run: |
          cat > rollback-package/docs/ROLLBACK.md <<DOC_EOF
          # Rollback Documentation

          This document describes how to roll back deployment **${{ needs.pre-deployment.outputs.current_sha }}**
          back to **${{ needs.pre-deployment.outputs.previous_sha }}** using this rollback package.

          ## Package Contents

          \`\`\`
          rollback-package/
          ├── scripts/
          │   ├── rollback.sh        # Main rollback driver (executable)
          │   └── verify-deps.sh     # Dependency verification script
          ├── backups/
          │   ├── package.json       # Captured package manifest
          │   ├── package-lock.json  # Captured lock file
          │   ├── .env.template      # Environment variable template
          │   └── MANIFEST.txt       # Capture metadata
          └── docs/
              └── ROLLBACK.md        # This document
          \`\`\`

          ## Deployment Metadata

          | Field | Value |
          | --- | --- |
          | Current Commit | \`${{ needs.pre-deployment.outputs.current_sha }}\` |
          | Previous Commit | \`${{ needs.pre-deployment.outputs.previous_sha }}\` |
          | Package Name | ${{ needs.pre-deployment.outputs.package_name }} |
          | Package Version | ${{ needs.pre-deployment.outputs.package_version }} |
          | Generated At | $(date -u +%Y-%m-%dT%H:%M:%SZ) |

          ## Step-by-Step Rollback

          ### Step 1 — Download and extract the artifact
          \`\`\`bash
          gh run download ${{ github.run_id }} --name rollback-package-${{ needs.pre-deployment.outputs.current_sha }}
          tar -xzf rollback-package-${{ needs.pre-deployment.outputs.current_sha }}.tar.gz
          \`\`\`

          ### Step 2 — Verify the checksum
          \`\`\`bash
          sha256sum -c rollback-package-${{ needs.pre-deployment.outputs.current_sha }}.tar.gz.sha256
          \`\`\`

          ### Step 3 — Run the rollback script
          \`\`\`bash
          cd rollback-package
          ./scripts/rollback.sh ${{ needs.pre-deployment.outputs.previous_sha }}
          \`\`\`

          ### Step 4 — Verify dependencies after rollback
          \`\`\`bash
          ./scripts/verify-deps.sh
          \`\`\`

          ### Step 5 — Smoke test the application
          Run your standard health checks (HTTP endpoint, smoke tests) and confirm
          the service is back to a healthy state before resuming traffic.

          ## Troubleshooting

          - **Target commit missing locally:** run \`git fetch --all --tags\` and
            ensure your remote contains \`${{ needs.pre-deployment.outputs.previous_sha }}\`.
          - **Dependency mismatch:** delete \`node_modules\` and rerun \`npm ci\`.
          - **Permission errors:** make sure the scripts are executable
            (\`chmod +x scripts/*.sh\`).

          ## Support

          The rollback artifact is retained for **30 days** in GitHub Actions.
          Open a new issue referencing the deployment tracking issue if assistance
          is needed.
          DOC_EOF

          echo "Rollback documentation created."

      - name: Compress rollback package and compute checksums
        id: package
        run: |
          set -e
          CURRENT_SHA="${{ needs.pre-deployment.outputs.current_sha }}"
          ARTIFACT_NAME="rollback-package-${CURRENT_SHA}"
          TARBALL_NAME="${ARTIFACT_NAME}.tar.gz"

          # Verify all expected components exist
          SCRIPT_OK="false"
          if [ -x rollback-package/scripts/rollback.sh ] && [ -x rollback-package/scripts/verify-deps.sh ]; then
            SCRIPT_OK="true"
          fi

          BACKUP_OK="false"
          if [ -f rollback-package/backups/package.json ] \
             && [ -f rollback-package/backups/package-lock.json ] \
             && [ -f rollback-package/backups/.env.template ]; then
            BACKUP_OK="true"
          fi

          # Build the tarball
          tar -czf "${TARBALL_NAME}" rollback-package
          INNER_CHECKSUM=$(sha256sum "${TARBALL_NAME}" | awk '{print $1}')
          sha256sum "${TARBALL_NAME}" > "${TARBALL_NAME}.sha256"

          # Also place a checksum file inside the package for self-contained verification
          cp "${TARBALL_NAME}.sha256" rollback-package/CHECKSUM.sha256

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "tarball_name=${TARBALL_NAME}" >> "$GITHUB_OUTPUT"
          echo "checksum=${INNER_CHECKSUM}" >> "$GITHUB_OUTPUT"
          echo "script_status=${SCRIPT_OK}" >> "$GITHUB_OUTPUT"
          echo "backup_status=${BACKUP_OK}" >> "$GITHUB_OUTPUT"

          echo "Artifact:        ${ARTIFACT_NAME}"
          echo "Tarball:         ${TARBALL_NAME}"
          echo "SHA256:          ${INNER_CHECKSUM}"
          echo "Script status:   ${SCRIPT_OK}"
          echo "Backup status:   ${BACKUP_OK}"

      - name: Upload rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-package-${{ needs.pre-deployment.outputs.current_sha }}
          path: |
            rollback-package/
            ${{ steps.package.outputs.tarball_name }}
            ${{ steps.package.outputs.tarball_name }}.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Post rollback plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}', 10);
            const previousSha = '${{ needs.pre-deployment.outputs.previous_sha }}';
            const currentSha = '${{ needs.pre-deployment.outputs.current_sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package_version }}';
            const artifactName = '${{ steps.package.outputs.artifact_name }}';
            const tarballName = '${{ steps.package.outputs.tarball_name }}';
            const checksum = '${{ steps.package.outputs.checksum }}';
            const scriptStatus = '${{ steps.package.outputs.script_status }}';
            const backupStatus = '${{ steps.package.outputs.backup_status }}';

            const body = [
              '## 🔄 Rollback Plan Ready',
              '',
              'A complete rollback package has been generated, validated, and uploaded as a workflow artifact.',
              '',
              '### Deployment Metadata',
              `Previous Commit: ${previousSha}`,
              `Current Commit: ${currentSha}`,
              `Package Version: ${packageVersion}`,
              `Artifact: ${artifactName}`,
              '',
              '### Rollback Components',
              '- ✅ Executable rollback script (`scripts/rollback.sh`) with `set -euo pipefail` and error trap',
              '- ✅ Configuration backups (`package.json`, `package-lock.json`, `.env.template`)',
              '- ✅ Dependency verification script (`scripts/verify-deps.sh`)',
              '- ✅ Detailed rollback documentation (`docs/ROLLBACK.md`)',
              '- ✅ Compressed rollback tarball with SHA256 checksum',
              '- ✅ Uploaded as GitHub Actions artifact (30-day retention)',
              '',
              '### Quick Rollback Command',
              '```bash',
              `gh run download ${context.runId} --name ${artifactName}`,
              `tar -xzf ${tarballName}`,
              `cd rollback-package && ./scripts/rollback.sh ${previousSha}`,
              '```',
              '',
              '### Verification Status',
              `- Rollback script created: ${scriptStatus}`,
              `- Configuration backup: ${backupStatus}`,
              '',
              '### Artifact Details',
              `- Name: ${artifactName}`,
              `- Tarball: ${tarballName}`,
              `- SHA256: ${checksum}`,
              '- Retention: 30 days',
              '',
              `Workflow Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join(String.fromCharCode(10));

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  post-deployment:
    name: post-deployment
    runs-on: ubuntu-latest
    needs: [pre-deployment, rollback-preparation]
    steps:
      - name: Update issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}', 10);

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: 'in-progress'
              });
              core.info('Removed in-progress label.');
            } catch (error) {
              core.warning(`Could not remove in-progress label: ${error.message}`);
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ['completed']
            });
            core.info('Added completed label.');

      - name: Post completion comment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}', 10);
            const previousSha = '${{ needs.pre-deployment.outputs.previous_sha }}';
            const currentSha = '${{ needs.pre-deployment.outputs.current_sha }}';
            const packageVersion = '${{ needs.pre-deployment.outputs.package_version }}';
            const artifactName = '${{ needs.rollback-preparation.outputs.artifact_name }}';
            const checksum = '${{ needs.rollback-preparation.outputs.checksum }}';

            const body = [
              '## 🎉 Deployment Completed Successfully',
              '',
              `Deployment of **${currentSha}** finished without errors.`,
              '',
              '### Stage Summary',
              '- ✅ Pre-deployment checks completed',
              '- ✅ Rollback preparation completed',
              '- ✅ Post-deployment verification completed',
              '',
              '### Deployment Metadata',
              `- Previous Commit: ${previousSha}`,
              `- Current Commit: ${currentSha}`,
              `- Package Version: ${packageVersion}`,
              '',
              '### Rollback Artifact Details',
              `- Artifact: ${artifactName}`,
              `- SHA256: ${checksum}`,
              '- Retention: 30 days',
              `- Workflow Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Closing this tracking issue. If a rollback is required within the next 30 days, ',
              `download the \`${artifactName}\` artifact and follow the included \`docs/ROLLBACK.md\`.`
            ].join(String.fromCharCode(10));

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

      - name: Close deployment tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = parseInt('${{ needs.pre-deployment.outputs.issue_number }}', 10);

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
            core.info(`Closed deployment tracking issue #${issueNumber}`);
